<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSM — Claude Session Manager</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-hover: #1c2128;
      --border: #30363d;
      --border-hi: #4a5568;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --danger: #f85149;
      --mono: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
    header { margin-bottom: 24px; }
    h1 {
      font-weight: 600;
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: -0.2px;
    }
    .subtitle { color: var(--muted); font-size: 13px; }
    .save-form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(220px, 2.5fr) auto;
      gap: 8px;
    }
    .save-form input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font: inherit;
      min-width: 0;
    }
    .save-form input::placeholder { color: var(--muted); }
    .save-form input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: white;
      border: 0;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      transition: background 100ms;
    }
    button:hover { background: var(--accent-hover); }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.ghost:hover { background: var(--panel-hover); border-color: var(--border-hi); }
    button.danger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger);
    }
    button.danger:hover {
      background: rgba(248, 81, 73, 0.08);
      border-color: var(--danger);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 24px 0 10px;
    }
    .section-header h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .section-hint { color: var(--muted); font-size: 12px; }
    .card.active { border-left: 2px solid var(--accent); }
    .card .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-left: 6px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 120ms;
    }
    .card:hover { border-color: var(--border-hi); }
    .card-name { font-size: 15px; font-weight: 600; }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
      font-size: 12px;
      color: var(--muted);
    }
    .card-meta .path,
    .card-meta .id { font-family: var(--mono); }
    .card-meta .path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .card-actions button {
      padding: 5px 10px;
      font-size: 12px;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 48px 20px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .toast {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
      max-width: 360px;
      font-size: 13px;
      animation: slide-in 140ms ease-out;
    }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CSM</h1>
      <div class="subtitle">Claude session manager · auto-refresh every 5s</div>
    </header>

    <form class="save-form" id="save-form">
      <input id="save-name" placeholder="session name (e.g. xpat-api)" required>
      <input id="save-path" placeholder="/Users/you/project/path" required>
      <button type="submit">Save</button>
    </form>

    <div id="active-section" hidden>
      <div class="section-header">
        <h2>Active now</h2>
        <span class="section-hint">unsaved sessions touched in the last 8h</span>
      </div>
      <div id="active-cards" class="grid"></div>
    </div>

    <div id="saved-section">
      <div class="section-header">
        <h2>Saved</h2>
      </div>
      <div id="cards" class="grid"></div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    const $ = sel => document.querySelector(sel);
    const cardsEl = $("#cards");
    const activeEl = $("#active-cards");
    const activeSection = $("#active-section");
    const toastEl = $("#toast");

    function relTime(iso) {
      const then = new Date(iso);
      const s = Math.floor((Date.now() - then.getTime()) / 1000);
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      if (s < 86400) return Math.floor(s / 3600) + "h ago";
      return Math.floor(s / 86400) + "d ago";
    }

    function shortPath(p) {
      return p.replace(/^\/Users\/[^/]+/, "~");
    }

    function toast(msg, kind = "ok") {
      const el = document.createElement("div");
      el.className = "toast" + (kind === "error" ? " error" : "");
      el.textContent = msg;
      toastEl.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    async function api(method, path, body) {
      const opts = { method };
      if (body !== undefined) {
        opts.headers = { "Content-Type": "application/json" };
        opts.body = JSON.stringify(body);
      }
      const r = await fetch(path, opts);
      const text = await r.text();
      const data = text ? JSON.parse(text) : {};
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    function renderCards(sessions) {
      const entries = Object.entries(sessions).sort(
        (a, b) => new Date(b[1].saved_at) - new Date(a[1].saved_at)
      );
      if (entries.length === 0) {
        cardsEl.innerHTML =
          '<div class="empty">No saved sessions yet. Use the form above to save one.</div>';
        return;
      }
      cardsEl.replaceChildren(...entries.map(([name, e]) => buildCard(name, e)));
    }

    function buildCard(name, e) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-name"></div>
        <div class="card-meta">
          <span class="path"></span>
          <span class="id"></span>
          <span class="saved"></span>
        </div>
        <div class="card-actions">
          <button data-act="resume">Resume</button>
          <button class="ghost" data-act="rename">Rename</button>
          <button class="danger" data-act="delete">Delete</button>
        </div>
      `;
      card.querySelector(".card-name").textContent = name;
      card.querySelector(".path").textContent = shortPath(e.project_path);
      card.querySelector(".id").textContent = e.session_id.slice(0, 8) + "…";
      card.querySelector(".saved").textContent = relTime(e.saved_at);
      card.querySelector('[data-act="resume"]').onclick = () => doResume(name);
      card.querySelector('[data-act="rename"]').onclick = () => doRename(name);
      card.querySelector('[data-act="delete"]').onclick = () => doDelete(name);
      return card;
    }

    function basename(p) {
      const parts = p.replace(/\/+$/, "").split("/");
      return parts[parts.length - 1] || p;
    }

    function buildActiveCard(entry) {
      const card = document.createElement("div");
      card.className = "card active";
      card.innerHTML = `
        <div class="card-name">
          <span class="proj"></span><span class="badge">live</span>
        </div>
        <div class="card-meta">
          <span class="path"></span>
          <span class="id"></span>
          <span class="saved"></span>
        </div>
        <div class="card-actions">
          <button data-act="save-as">Save as…</button>
        </div>
      `;
      card.querySelector(".proj").textContent = basename(entry.project_path);
      card.querySelector(".path").textContent = shortPath(entry.project_path);
      card.querySelector(".id").textContent = entry.session_id.slice(0, 8) + "…";
      card.querySelector(".saved").textContent =
        "active " + relTime(entry.last_active);
      card.querySelector('[data-act="save-as"]').onclick = () =>
        doSaveAs(entry);
      return card;
    }

    function renderActive(activeList, savedSessions) {
      const savedIds = new Set(
        Object.values(savedSessions).map(e => e.session_id)
      );
      const unsaved = activeList.filter(a => !savedIds.has(a.session_id));
      if (unsaved.length === 0) {
        activeSection.hidden = true;
        return;
      }
      activeSection.hidden = false;
      activeEl.replaceChildren(...unsaved.map(buildActiveCard));
    }

    async function refresh() {
      try {
        const [saved, activeData] = await Promise.all([
          api("GET", "/api/sessions"),
          api("GET", "/api/active"),
        ]);
        const sessions = saved.sessions || {};
        renderActive(activeData.active || [], sessions);
        renderCards(sessions);
      } catch (e) {
        toast(`refresh failed: ${e.message}`, "error");
      }
    }

    async function doSaveAs(entry) {
      const suggested = basename(entry.project_path);
      const name = prompt(
        `Save active session as:\n${shortPath(entry.project_path)}`,
        suggested
      );
      if (!name) return;
      try {
        await api("POST", "/api/sessions/save", {
          name: name.trim(),
          path: entry.project_path,
        });
        toast(`saved '${name.trim()}'`);
        refresh();
      } catch (e) {
        toast(`save failed: ${e.message}`, "error");
      }
    }

    async function doResume(name) {
      try {
        await api("POST", "/api/sessions/resume", { name });
        toast(`resumed '${name}' in new iTerm tab`);
      } catch (e) {
        toast(`resume failed: ${e.message}`, "error");
      }
    }

    async function doRename(name) {
      const newName = prompt(`Rename "${name}" to:`, name);
      if (!newName || newName === name) return;
      try {
        await api(
          "PATCH",
          `/api/sessions/${encodeURIComponent(name)}/rename`,
          { new_name: newName }
        );
        toast(`renamed to '${newName}'`);
        refresh();
      } catch (e) {
        toast(`rename failed: ${e.message}`, "error");
      }
    }

    async function doDelete(name) {
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        await api("DELETE", `/api/sessions/${encodeURIComponent(name)}`);
        toast(`deleted '${name}'`);
        refresh();
      } catch (e) {
        toast(`delete failed: ${e.message}`, "error");
      }
    }

    $("#save-form").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("#save-name").value.trim();
      const path = $("#save-path").value.trim();
      try {
        await api("POST", "/api/sessions/save", { name, path });
        toast(`saved '${name}'`);
        $("#save-name").value = "";
        $("#save-path").value = "";
        refresh();
      } catch (err) {
        toast(`save failed: ${err.message}`, "error");
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
